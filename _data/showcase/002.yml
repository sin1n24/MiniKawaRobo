description: "市販のパーツを組み合わせるだけで、とりあえず動作させることができるお手軽なロボットです。体当たりが主な攻撃手段ですが、初めての一台として最適。制御は [M5Capsule](https://ssci.to/9272) と [5サーボ接続基板キット](https://ssci.to/11121)、動力は [Servo Kit 360'](https://ssci.to/6479)。M5Capsuleの内蔵バッテリーを活用し、配線を極限までシンプルにしています。プログラムは [こちらの記事](https://sin1n24.hatenablog.com/entry/2025/10/18/231400) で公開中です。"
