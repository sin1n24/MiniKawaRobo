name: "ミニレパード"
creator: "sin1"
description: "ダブルヘリカルギア（やまば歯車）がチャームポイントの実戦的なロボットです。複雑なギア機構を3Dプリンタで出力し、小型ながら力強い動きを実現しています。制御は [AtomS3](https://ssci.to/8670) と [4サーボ接続基板キット](https://ssci.to/11122)、動力は移動用の360°サーボ2個とアーム用の180°サーボ1個。3Dプリントしたフレームにダブルヘリカルギアを搭載しています。プログラムは [こちらの記事](https://sin1n24.hatenablog.com/entry/2025/10/18/231400) で公開中です。"
