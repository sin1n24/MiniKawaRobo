---
layout: default
---

{% if page.hero_heading %}
<div class="hero-section mkr-hero" style="text-align: center; padding: 4rem 2rem; min-height: 340px; display: flex; flex-direction: column; justify-content: center; background-image: url('{{ page.hero_image | relative_url }}'); background-size: cover; background-position: center; margin-bottom: 3rem;">
  {% include showcase_hero.html %}
  <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4);"></div>

  <div style="position: relative; z-index: 1;">
  <h1 class="fs-9 fw-700" style="margin-top: 0; color: #ffffff; text-shadow: 1px 1px 6px rgba(0,0,0,0.8);">{{ page.hero_heading }}</h1>
  <p class="fs-5" style="color: #ffffff; margin-bottom: 2rem; text-shadow: 1px 1px 6px rgba(0,0,0,0.8);">{{ page.hero_body }}</p>
  
  {% if page.hero_ctas %}
  <div>
    {% for cta in page.hero_ctas %}
    <a href="{{ cta.link }}" class="btn {% if forloop.first %}btn-primary{% endif %} fs-5" {% if cta.target %}target="{{ cta.target }}"{% endif %} style="margin-right: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
      {{ cta.label }}
    </a>
    {% endfor %}
  </div>
  {% endif %}
  </div>

</div>
{% endif %}

{{ content }}
